spring.application.name=trading

server.port=${SERVER_PORT:9229}
logging.level.org.springframework=INFO
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/yt_trading}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rupali}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# JWT Security
jwt.secret=${JWT_SECRET:trading_platform_super_secret_jwt_key_must_be_at_least_256_bits_long_for_hmac_sha256}

# In-Memory Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=60s

stripe.api.key=${STRIPE_API_KEY:STRIPE_API_KEY}
razorpay.api.key=${RAZORPAY_API_KEY:RAZORPAY_API_KEY}
razorpay.api.secret=${RAZORPAY_API_SECRET:RAZORPAY_API_SECRET}